# phone-armor 命令闸门配置
#
# 每个值三档：
#   0 = 只提示，照常执行（默认）
#   1 = 拦截，不执行
#   2 = 完全放行，连提示都不打
#
# 改完立刻生效，不需要重装、不需要重启。
# 新增规则：在 guard.sh 的 case 里加一段，key 写进这里即可。

# 原始包扫描
masscan=0

# nmap 只针对 -sS/-sU 和 /16 及更大的网段；-sT 单目标不检查
nmap_syn=0

# 无 GPU，CPU 模式跑真实哈希等于放弃（--benchmark 永远放行）
hashcat=0

# 内网综合扫描：只针对 /16 及更大网段
fscan=0
gogo=0

# PRoot 里跑不了容器
docker=0

# ffmpeg：4K 输出与超过 100 MB 的输入素材
ffmpeg_big=0

# 总开关：设成 2 等于临时关掉整个闸门
bypass_all=0
